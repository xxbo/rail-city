name: Prepare pinned Rust toolchain
on:
  push:
    branches: ['build-tools/**']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Install compiler
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
      - name: Archive compiler distribution only
        run: tar --exclude=share/doc -czf "$RUNNER_TEMP/rust-toolchain.tar.gz" -C "$HOME/.rustup/toolchains/1.99.1-x86_64-unknown-linux-gnu" .
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-rust-compiler
          path: ${{ runner.temp }}/rust-toolchain.tar.gz
          retention-days: 1
