name: Rail City CI and Pages
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build and verify pinned Rust and WASM
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
          node scripts/build_rail_wasm.cjs
          node scripts/build_rail_wasm.cjs --check
      - name: Build and verify Rust initialization and session artifact
        run: |
          node scripts/build_rail_session_contract.cjs
          node scripts/build_rail_session_contract.cjs --check
      - name: Verify Rust unit tests after compilation
        run: cargo +1.99.1 test --locked --features session-contract --manifest-path rust/rail-routing/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: rail-build
          path: |
            rail/wasm/rail-core-v33.wasm
            scripts/fixtures/rail-session-contract-v9.wasm
          if-no-files-found: error
          retention-days: 3
  regressions:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: rail-build
          path: .
      - name: Verify simulation and standalone publication
        run: node scripts/run_rail_tests.cjs
      - name: Verify current release function boundary
        run: node scripts/audit_rail_release.cjs --output="$RUNNER_TEMP/rail-release-boundary.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rail-release-boundary
          path: ${{ runner.temp }}/rail-release-boundary.json
          if-no-files-found: ignore
          retention-days: 14
  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: rail-build
          path: .
      - name: Verify Rust session and game in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/rail-p3-browser" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/rail-p3-browser/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/rail-p3-browser/node_modules" node scripts/probe_rail_p3_browser.cjs "$RUNNER_TEMP/rail-p3-browser-results.json"
          NODE_PATH="$RUNNER_TEMP/rail-p3-browser/node_modules" RAIL_ACCEPTANCE_SOURCE="$GITHUB_SHA" RAIL_BROWSER_EVIDENCE="$RUNNER_TEMP/rail-release-browser.json" node scripts/probe_rail_release.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rail-p3-browser-verification
          path: |
            ${{ runner.temp }}/rail-p3-browser-results.json
            ${{ runner.temp }}/rail-release-browser.json
          if-no-files-found: ignore
          retention-days: 14
  verify:
    needs: [regressions, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: rail-build
          path: .
      - name: Stage verified game
        run: node scripts/publish_rail.cjs . _site
      - uses: actions/upload-artifact@v4
        with:
          name: rail-city-public
          path: _site
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: rail-city-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rail-city-public
          path: _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify the published revision and play both maps on Pages
        env:
          RAIL_PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          RAIL_ACCEPTANCE_SOURCE: ${{ github.sha }}
        run: |
          for attempt in {1..12}; do
            if curl -fsSL "${RAIL_PAGES_URL%/}/deployment.json?run=$GITHUB_RUN_ID" | jq -e --arg sha "$GITHUB_SHA" '.source == $sha'; then break; fi
            if [ "$attempt" = 12 ]; then exit 1; fi
            sleep 5
          done
          npm install --prefix "$RUNNER_TEMP/rail-live" --no-save --package-lock=false playwright@1.62.1
          NODE_PATH="$RUNNER_TEMP/rail-live/node_modules" RAIL_CHROMIUM="$(command -v google-chrome)" node scripts/probe_rail_release.cjs
